<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シンキングツール｜試作版</title><style>:root{font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;color:#242424;background:#fafaf8}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #ddd;padding:15px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center}header b{font-size:19px}button{font:inherit;cursor:pointer;border:1px solid #bbb;background:white;border-radius:7px;padding:10px 14px;color:inherit}button:hover{background:#f3f3ee}button:focus-visible{outline:3px solid #bb945d}main{max-width:1050px;margin:30px auto;padding:0 20px}h1{font-size:26px;margin:10px 0 8px}h2{font-size:20px}.muted{color:#666}.choices,.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.choice{min-height:190px;text-align:left;padding:25px;border:1px solid #bbb;background:white}.choice strong{font-size:22px;display:block;margin-bottom:15px}.choice span{color:#666}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.active{background:#e8e2d6;border-color:#9b8b70}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.tool{padding:17px;text-align:left;min-height:130px;background:white}.thumb{height:92px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eee;margin-bottom:10px}.thumb svg{width:100%;height:85px}.search{width:100%;padding:12px;border:1px solid #aaa;border-radius:6px;font:inherit;margin:8px 0}.tool strong{display:block;font-size:17px;margin:6px 0}.tool small{color:#666}.num{color:#84775e;font-size:12px}.back{border:0;background:transparent;padding:8px 0}.preview{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}.panel{background:white;border:1px solid #ddd;padding:22px;border-radius:8px}.diagram{min-height:250px;display:flex;align-items:center;justify-content:center}.venn{position:relative;width:310px;height:190px}.circle{border:3px solid #847e73;border-radius:50%;width:180px;height:180px;position:absolute;top:4px;display:flex;align-items:center;padding:20px}.circle:first-child{left:0;justify-content:flex-start}.circle:last-child{right:0;justify-content:flex-end}.yshape{width:240px;height:220px;position:relative}.yshape:before{content:' ';position:absolute;left:50%;top:50%;width:2px;height:50%;background:#888}.yshape:after{content:'╲      ╱';position:absolute;top:20%;left:14%;font-size:50px;color:#888}.editor{margin-top:18px}.editor input,.editor textarea{width:100%;font:inherit;padding:10px;border:1px solid #aaa;border-radius:5px;margin:5px 0 12px}.editor textarea{min-height:100px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tag{display:inline-block;background:#efede8;padding:5px 9px;margin:3px;border-radius:5px;font-size:13px}.note{border-left:3px solid #b19b75;padding-left:12px;margin-top:16px;color:#555}.hidden{display:none}@media(max-width:700px){.choices,.cards,.preview{grid-template-columns:1fr}.choice{min-height:140px}.venn{transform:scale(.8)}} </style><link rel="stylesheet" href="editor.css"></head><body><header><b>シンキングツール <small class="muted">試作版</small></b><button id="homeBtn">ホームへ</button></header><main id="app"></main><script src="model.js"></script><script src="app.js"></script><script src="exports.js"></script><script src="extra-editor.js"></script><script src="direct-ui.js"></script><script src="canvas-ui.js"></script><script src="editor.js"></script></body></html>
